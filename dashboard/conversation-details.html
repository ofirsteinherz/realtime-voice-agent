<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation Details — Voice Bot Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.463.0/dist/umd/lucide.js"></script>
  <style>
    :focus-visible { outline: 2px solid rgba(59,130,246,.8); outline-offset: 2px; border-radius: 8px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px) scale(0.98); filter: blur(4px);} to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0);} }
    @keyframes fadeIn { from { opacity: 0; filter: blur(6px);} to { opacity: 1; filter: blur(0);} }
  </style>
</head>
<body class="text-gray-100 antialiased bg-neutral-950 bg-[radial-gradient(60%_40%_at_50%_0%,rgba(99,102,241,0.15),rgba(0,0,0,0)_70%)]" style="font-family: Inter, ui-sans-serif, system-ui;">
  
  <!-- Header -->
  <header class="max-w-7xl flex ring-1 ring-white/10 bg-white/5 rounded-2xl mt-6 mr-auto mb-6 ml-auto pt-6 pr-6 pb-6 pl-6 backdrop-blur-md items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-300 hover:text-gray-100 transition-colors font-geist">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        Back to Dashboard
      </a>
    </div>
    
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center justify-center h-10 w-10 rounded-xl bg-indigo-500/20 ring-1 ring-indigo-500/30 backdrop-blur">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-messages-square text-indigo-400"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4c0-1.1.9-2 2-2h8a2 2 0 0 1 2 2z"></path><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"></path></svg>
      </span>
      <div>
        <div class="text-sm font-semibold tracking-tight font-geist text-gray-100">Conversation Details</div>
        <div class="text-xs text-gray-400 font-geist">Full message history</div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mr-auto ml-auto pr-6 pl-6">
    
    <!-- Conversation Info Card -->
    <section class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 md:p-7 shadow-sm ring-1 ring-white/15 mb-6" style="animation: fadeUp .6s ease-out both;">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div class="flex-1">
          <h2 class="text-lg md:text-xl font-semibold tracking-tight font-geist text-gray-100" id="conversation-title">Loading...</h2>
          <p class="text-xs text-gray-400 mt-1 font-geist" id="conversation-subtitle"></p>
        </div>
        <button onclick="window.print()" class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg bg-white/10 border border-white/15 hover:bg-white/20 text-gray-100 backdrop-blur font-geist">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-printer"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"></path><rect x="6" y="14" width="12" height="8" rx="1"></rect></svg>
          Print
        </button>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-white/5 rounded-xl p-3 border border-white/10">
          <div class="text-xs text-gray-400 font-geist">Session ID</div>
          <div class="text-sm font-semibold text-gray-100 mt-1 font-mono truncate" id="session-id">-</div>
        </div>
        <div class="bg-white/5 rounded-xl p-3 border border-white/10">
          <div class="text-xs text-gray-400 font-geist">Customer</div>
          <div class="text-sm font-semibold text-gray-100 mt-1 font-geist" id="customer-info">-</div>
        </div>
        <div class="bg-white/5 rounded-xl p-3 border border-white/10">
          <div class="text-xs text-gray-400 font-geist">Messages</div>
          <div class="text-sm font-semibold text-gray-100 mt-1 font-geist" id="message-count">0</div>
        </div>
        <div class="bg-white/5 rounded-xl p-3 border border-white/10">
          <div class="text-xs text-gray-400 font-geist">Timestamp</div>
          <div class="text-sm font-semibold text-gray-100 mt-1 font-geist" id="timestamp">-</div>
        </div>
      </div>
    </section>

    <!-- Messages -->
    <section class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 md:p-7 shadow-sm ring-1 ring-white/15 mb-6" style="animation: fadeUp .7s ease-out both; animation-delay: .1s;">
      <h3 class="text-lg font-semibold tracking-tight text-gray-100 font-geist mb-4">💬 Conversation Flow</h3>
      
      <div id="conversation-content" class="space-y-4">
        <!-- Messages will be inserted here -->
        <div class="text-center text-gray-400 text-sm py-8">Loading conversation...</div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="max-w-7xl mx-auto px-6 py-10 mt-12 border-t border-white/10">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <div class="text-sm font-semibold tracking-tight font-geist text-gray-100">Voice Bot Analytics</div>
          <p class="text-xs text-gray-400 font-geist">© <span id="year">2025</span> All rights reserved.</p>
        </div>
        <div class="flex items-center gap-3 text-xs text-gray-400 font-geist">
          <a href="dashboard.html" class="hover:text-gray-100 transition-colors">← Back to Dashboard</a>
        </div>
      </div>
    </footer>
  </main>

  <script>
    // Get conversation data from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const conversationId = urlParams.get('id');
    
    // Load conversation data from localStorage or API
    async function loadConversation() {
      if (!conversationId) {
        document.getElementById('conversation-content').innerHTML = 
          '<div class="text-center text-gray-400 text-sm py-8">No conversation selected</div>';
        return;
      }

      try {
        // Try to get data from localStorage first (passed from dashboard)
        const storedData = localStorage.getItem(`conversation_${conversationId}`);
        
        if (storedData) {
          const conv = JSON.parse(storedData);
          displayConversation(conv);
        } else {
          // If not in localStorage, try to fetch from API
          const response = await fetch(`http://localhost:8002/api/metrics`);
          if (!response.ok) throw new Error('Failed to fetch data');
          
          const data = await response.json();
          const conversations = data.conversations_last_week?.conversations || [];
          const conv = conversations.find(c => c.session_id.startsWith(conversationId));
          
          if (conv) {
            displayConversation({
              session_id: conv.session_id,
              customer: conv.customer_id || 'unknown',
              messages: conv.messages || [],
              timestamp: conv.timestamp
            });
          } else {
            document.getElementById('conversation-content').innerHTML = 
              '<div class="text-center text-gray-400 text-sm py-8">Conversation not found</div>';
          }
        }
      } catch (error) {
        console.error('Error loading conversation:', error);
        document.getElementById('conversation-content').innerHTML = 
          '<div class="text-center text-red-400 text-sm py-8">Error loading conversation</div>';
      }
    }

    function displayConversation(conv) {
      // Update header info
      document.getElementById('conversation-title').textContent = 'Conversation Details';
      document.getElementById('conversation-subtitle').textContent = `Session: ${conv.session_id}`;
      
      // Update stats
      document.getElementById('session-id').textContent = conv.session_id;
      document.getElementById('customer-info').textContent = conv.customer || 'Unknown';
      document.getElementById('message-count').textContent = conv.messages?.length || 0;
      document.getElementById('timestamp').textContent = conv.timestamp ? new Date(conv.timestamp).toLocaleString() : '-';
      
      // Display messages
      if (!conv.messages || conv.messages.length === 0) {
        document.getElementById('conversation-content').innerHTML = 
          '<div class="text-center text-gray-400 text-sm py-8">No messages available for this conversation</div>';
        return;
      }
      
      const messagesHtml = conv.messages.map(msg => {
        const role = msg.role || 'user';
        const timestamp = msg.timestamp || '';
        
        // Handle function calls (tool calls)
        if (role === 'assistant' && msg.function_name) {
          const funcName = msg.function_name;
          const args = JSON.stringify(msg.arguments || {}, null, 2);
          return `
            <div class="text-center">
              <div class="inline-block max-w-[90%]">
                <div class="text-[11px] text-gray-400 mb-1 font-geist">
                  🔧 Tool Call${timestamp ? ` • ${timestamp}` : ''}
                </div>
                <div class="px-4 py-3 rounded-xl bg-amber-500/10 border border-amber-500/30">
                  <div class="text-xs font-semibold text-amber-300 mb-2 font-geist">${funcName}</div>
                  <pre class="text-[11px] text-gray-300 font-mono text-left overflow-x-auto">${args}</pre>
                </div>
              </div>
            </div>
          `;
        }
        
        // Handle function results
        if (role === 'function') {
          const funcName = msg.function_name || 'Unknown';
          let result = msg.result || '';
          try {
            const parsed = JSON.parse(result);
            result = JSON.stringify(parsed, null, 2);
          } catch (e) {
            // Keep as is if not JSON
          }
          return `
            <div class="text-center">
              <div class="inline-block max-w-[90%]">
                <div class="text-[11px] text-gray-400 mb-1 font-geist">
                  ✅ Tool Response${timestamp ? ` • ${timestamp}` : ''}
                </div>
                <div class="px-4 py-3 rounded-xl bg-green-500/10 border border-green-500/30">
                  <div class="text-xs font-semibold text-green-300 mb-2 font-geist">${funcName}</div>
                  <pre class="text-[11px] text-gray-300 font-mono text-left overflow-x-auto max-h-32">${result}</pre>
                </div>
              </div>
            </div>
          `;
        }
        
        // Handle regular messages
        const content = msg.content || '';
        if (!content) return ''; // Skip empty messages
        
        return `
          <div class="${role === 'user' ? 'text-left' : 'text-right'}">
            <div class="inline-block max-w-[80%]">
              <div class="text-[11px] text-gray-400 mb-1 font-geist ${role === 'assistant' ? 'text-right' : 'text-left'}">
                ${role === 'user' ? '👤 User' : '🤖 Assistant'}${timestamp ? ` • ${timestamp}` : ''}
              </div>
              <div class="px-4 py-3 rounded-2xl ${role === 'user' ? 'bg-indigo-500/20 border border-indigo-500/30' : 'bg-white/10 border border-white/15'}">
                <p class="text-sm text-gray-100 font-geist whitespace-pre-wrap">${content}</p>
              </div>
            </div>
          </div>
        `;
      }).filter(html => html).join('');
      
      document.getElementById('conversation-content').innerHTML = messagesHtml;
    }

    // Update year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Load conversation on page load
    window.addEventListener('DOMContentLoaded', loadConversation);

    // Lucide icons
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
